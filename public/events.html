<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events — Taraba State Ministry of Secondary, Vocational and Technical Education</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-active="/events.html">
  <div id="site-header"></div>

  <main class="container">
    <div class="page-head">
      <h1>Upcoming events</h1>
      <p class="sub">Meetings, workshops and public notices from the ministry.</p>
    </div>

    <div class="filter-bar">
      <div class="field grow">
        <label for="q">Search</label>
        <input type="search" id="q" placeholder="Search events…">
      </div>
      <button class="btn" type="button" id="search-btn">Search</button>
    </div>

    <div id="events-list">
      <div class="empty-state"><strong>Loading…</strong></div>
    </div>

    <div class="spread mt-2" id="past-toggle-wrap" hidden>
      <button class="btn btn-outline btn-sm" type="button" id="past-toggle">Show past events</button>
    </div>
    <div id="past-list"></div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/pages/events.js"></script>
</body>
</html>
