<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My dashboard — TSMSVTE Portal</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-active="/dashboard.html" data-auth="true">
  <div id="site-header"></div>

  <main class="container">
    <div class="page-head">
      <h1 id="dash-title">My dashboard</h1>
      <p class="sub" id="dash-sub">Loading your record…</p>
    </div>

    <div class="grid grid-3 mb-3">
      <div class="stat-card">
        <div class="num" id="stat-mail">—</div>
        <div class="label">Unread portal mail</div>
        <a class="btn btn-sm btn-outline mt-1" href="/mail.html">Open mail</a>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-status">—</div>
        <div class="label">Registration status</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-notifs">—</div>
        <div class="label">Notifications</div>
        <button class="btn btn-sm btn-ghost mt-1" type="button" id="mark-read">Mark all read</button>
      </div>
    </div>

    <div class="grid grid-2">
      <section class="card">
        <div class="card-head"><h2>My staff record</h2></div>
        <div id="staff-record" class="detail-list"><p class="muted">Loading…</p></div>
        <hr class="divider">
        <h3>Update contact details</h3>
        <div class="form-error hidden" id="profile-error"></div>
        <form id="profile-form" novalidate>
          <div class="field">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" maxlength="40">
          </div>
          <div class="field">
            <label for="photo">New passport photograph <span class="muted">(optional, max 3 MB)</span></label>
            <input type="file" id="photo" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
          </div>
          <button class="btn" type="submit" id="profile-btn">Save changes</button>
        </form>
      </section>

      <section class="card">
        <div class="card-head"><h2>Notifications</h2></div>
        <div id="notif-stream"><p class="muted">Loading…</p></div>
      </section>
    </div>

    <section class="card mt-2">
      <div class="card-head"><h2>Quick links</h2></div>
      <div class="row">
        <a class="btn btn-outline" href="/mail.html">Portal mail</a>
        <a class="btn btn-outline" href="/circulars.html">Circulars</a>
        <a class="btn btn-outline" href="/news.html">News</a>
        <a class="btn btn-outline" href="/faq.html">FAQ</a>
        <a class="btn btn-ghost" href="/schools.html">Schools directory</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
