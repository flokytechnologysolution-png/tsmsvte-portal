<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Taraba State Ministry of Secondary, Vocational and Technical Education</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-active="/login.html" data-minimal="true">
  <div id="site-header"></div>

  <main class="container">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Staff sign in</h1>
        <p class="auth-sub">Use the portal account issued by the ministry.</p>

        <div class="form-error hidden" id="login-error"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@tsmsvte.gov.ng">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-block btn-lg" type="submit" id="login-btn">Sign in</button>
        </form>

        <p class="auth-alt">Lost your password? An administrator can issue a one-time reset token for you.</p>
        <p class="auth-alt">New to the portal? <a href="/register.html">Register as staff</a></p>
        <p class="auth-alt"><a href="/">&larr; Back to the public site</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
