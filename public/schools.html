<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schools directory — Taraba State Ministry of Secondary, Vocational and Technical Education</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-active="/schools.html">
  <div id="site-header"></div>

  <main class="container">
    <div class="page-head spread">
      <div>
        <h1>Schools directory</h1>
        <p class="sub">Secondary, vocational and technical schools across Taraba State.</p>
      </div>
      <a class="btn btn-outline btn-sm" href="/register-school.html">Add a school</a>
    </div>

    <div class="filter-bar">
      <div class="field grow">
        <label for="q">Search</label>
        <input type="search" id="q" placeholder="School name, town or principal…">
      </div>
      <div class="field">
        <label for="lga">LGA</label>
        <select id="lga"><option value="">All LGAs</option></select>
      </div>
      <div class="field">
        <label for="type">Type</label>
        <select id="type"><option value="">All types</option></select>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category"><option value="">All categories</option></select>
      </div>
      <div class="field">
        <label for="boarding">Boarding</label>
        <select id="boarding"><option value="">Any</option></select>
      </div>
      <button class="btn" type="button" id="search-btn">Filter</button>
      <button class="btn btn-ghost" type="button" id="reset-btn">Reset</button>
    </div>

    <div id="school-count" class="mb-2 muted"></div>
    <div class="grid grid-3" id="school-grid">
      <div class="empty-state"><strong>Loading…</strong></div>
    </div>
    <div id="school-pager"></div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/pages/schools.js"></script>
</body>
</html>
