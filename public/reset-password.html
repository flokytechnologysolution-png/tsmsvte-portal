<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password — Taraba State Ministry of Secondary, Vocational and Technical Education</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-active="/login.html" data-minimal="true">
  <div id="site-header"></div>

  <main class="container">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Set a new password</h1>
        <p class="auth-sub">Paste the one-time reset token your administrator gave you, then choose a new password.</p>

        <div class="form-error hidden" id="rp-error"></div>
        <div class="form-success hidden" id="rp-success"></div>

        <form id="rp-form" novalidate>
          <div class="field">
            <label for="token">Reset token</label>
            <input type="text" id="token" autocomplete="one-time-code" required>
          </div>
          <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" autocomplete="new-password" required>
            <div class="hint">At least 8 characters, with letters and numbers.</div>
          </div>
          <div class="field">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" autocomplete="new-password" required>
          </div>
          <button class="btn btn-block btn-lg" type="submit" id="rp-btn">Change password</button>
        </form>

        <p class="auth-alt"><a href="/login.html">Back to sign in</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/pages/reset-password.js"></script>
</body>
</html>
