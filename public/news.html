<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News — Taraba State Ministry of Secondary, Vocational and Technical Education</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-active="/news.html">
  <div id="site-header"></div>

  <main class="container">
    <div class="page-head">
      <h1>News &amp; announcements</h1>
      <p class="sub">Official updates from the ministry.</p>
    </div>

    <div class="filter-bar">
      <div class="field grow">
        <label for="q">Search</label>
        <input type="search" id="q" placeholder="Search headlines…">
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category"><option value="">All categories</option></select>
      </div>
      <button class="btn" type="button" id="search-btn">Search</button>
    </div>

    <div class="grid grid-3" id="news-grid">
      <div class="empty-state"><strong>Loading…</strong></div>
    </div>
    <div id="news-pager"></div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/pages/news.js"></script>
</body>
</html>
